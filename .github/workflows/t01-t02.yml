name: T01 and T02 comparative experiments
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t01-t02.yml', 'experiments/t01-adapter.mjs', 'experiments/t02-repeat.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t01-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch exact donor
        run: |
          git init upstream
          git -C upstream fetch --depth=1 https://github.com/jameschen83/chatgpt_pane_control.git 7c617224c8af16ffc678ddd5640068199e8c9ad3
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 7c617224c8af16ffc678ddd5640068199e8c9ad3
      - name: Install and run targeted native baseline
        working-directory: upstream
        run: |
          node --version
          npm install --global --no-audit --no-fund pnpm@10.11.0
          pnpm --version
          pnpm install --frozen-lockfile
          node --test tests/adapter.test.js
      - name: Run T01 fixture variants and oracle controls
        working-directory: upstream
        run: |
          cp ../experiments/t01-adapter.mjs tests/t01-adapter.mjs
          node --test tests/t01-adapter.mjs
  t02-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
          no-cache: true
      - name: Fetch exact donor
        run: |
          git init upstream
          git -C upstream fetch --depth=1 https://github.com/voyager-crew/voyager.git f5d615a181ebf7a35ad535dcabdedbf4ed015095
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = f5d615a181ebf7a35ad535dcabdedbf4ed015095
      - name: Install and run targeted native baseline
        working-directory: upstream
        run: |
          node --version
          bun --version
          bun install --frozen-lockfile
          bun run test src/features/plugins/sources/bundledPluginsLifecycle.test.ts
      - name: Run T02 repeated lifecycle with observer controls
        working-directory: upstream
        run: |
          python3 ../experiments/t02-repeat.py
          bun run test src/features/plugins/sources/bundledPluginsLifecycle.test.ts --testTimeout=20000
