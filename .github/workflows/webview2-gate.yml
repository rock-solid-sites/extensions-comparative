name: WebView2 workspace increment build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/webview2-gate.yml', 'experiments/webview2-gate/**', 'experiments/webview2-updater/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webview2-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Test registry semantics
        run: node --test experiments/webview2-gate/workspace.test.cjs
      - name: Test sidebar fixture
        shell: pwsh
        run: |
          npm install --prefix $env:RUNNER_TEMP/chatws-fixture --no-audit --no-fund --ignore-scripts jsdom@26.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = "$env:RUNNER_TEMP/chatws-fixture/node_modules"
          node --test experiments/webview2-gate/workspace.dom.test.cjs
      - name: Publish workspace probe
        run: dotnet publish experiments/webview2-gate/Gate.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o out
      - name: Verify binary
        shell: pwsh
        run: |
          $file = Get-Item out/ChatWorkspaceWebViewGate.exe
          if ($file.Length -le 0) { throw "Missing executable" }
          Get-FileHash $file.FullName -Algorithm SHA256
      - name: Package and test module updates
        shell: pwsh
        run: ./experiments/webview2-gate/package.ps1 -PublishDir out -ModuleDir module -Version $env:GITHUB_SHA
      - name: Build and verify single-file update executable
        shell: pwsh
        run: |
          $payload = (Resolve-Path module/workspace-module.json).Path
          dotnet publish experiments/webview2-updater/Updater.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true "-p:ModuleEnvelope=$payload" -o updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item updater/ChatWorkspace-Update.exe
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Updater self-test failed' }
          Write-Output "PASS updater replacement, rollback, invalid payload and missing host checks"
          Write-Output "Updater executable bytes: $($exe.Length)"
          Get-FileHash $exe.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v7
        with:
          path: updater/ChatWorkspace-Update.exe
          archive: false
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ChatWorkspace-baseline-net11-win-x64
          path: out/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ChatWorkspace-module-v1
          path: module/
          if-no-files-found: error
          retention-days: 3
