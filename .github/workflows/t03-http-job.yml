name: T03 actual HTTP and persisted job composition
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t03-http-job.yml', 'experiments/t03-http-job.test.ts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
          no-cache: true
      - name: Fetch exact public sources
        run: |
          git init cli
          git -C cli fetch --depth=1 https://github.com/voyager-crew/voyager-cli.git 44ebff31e1f4da93c07a52551f042c1d62d38818
          git -C cli checkout --detach FETCH_HEAD
          test "$(git -C cli rev-parse HEAD)" = 44ebff31e1f4da93c07a52551f042c1d62d38818
          git init voyager
          git -C voyager fetch --depth=1 https://github.com/voyager-crew/voyager.git f5d615a181ebf7a35ad535dcabdedbf4ed015095
          git -C voyager checkout --detach FETCH_HEAD
          test "$(git -C voyager rev-parse HEAD)" = f5d615a181ebf7a35ad535dcabdedbf4ed015095
      - name: Install CLI and native job baseline
        working-directory: cli
        run: |
          bun --version
          bun install --frozen-lockfile
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('node_modules/@voyager-crew/bridge-protocol/package.json')); if(p.version!=='0.5.0')process.exit(1); console.log(p.version)"
          bun run test test/jobs/jobs.test.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
          no-cache: true
      - name: Install Voyager and native dispatcher baseline
        working-directory: voyager
        run: |
          bun --version
          bun install --frozen-lockfile
          node -e "const p=require('./packages/bridge-protocol/package.json'); if(p.version!=='0.5.0')process.exit(1); console.log(p.version)"
          bun run test src/pages/background/bridge/__tests__/bridgeDispatcher.delivery.test.ts src/pages/background/bridge/__tests__/bridgeDispatcher.tabs.test.ts
      - name: Compose real HTTP bridge and persisted job with simulated provider
        working-directory: voyager
        run: |
          cp ../experiments/t03-http-job.test.ts src/pages/background/bridge/__tests__/t03-http-job.test.ts
          bun run test src/pages/background/bridge/__tests__/t03-http-job.test.ts
